version: "3.9"

services:
  ga4-mcp:
    build: .
    image: ga4-mcp:latest
    container_name: ga4-mcp
    stdin_open: true
    tty: true
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/google-credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-tukiverse-oauth}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/credentials/google-credentials.json:ro

  ga4-mcp-http:
    build: .
    image: ga4-mcp:latest
    container_name: ga4-mcp-http
    entrypoint: ["python3", "/usr/local/bin/run_http.py"]
    ports:
      - "8081:8080"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/google-credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-tukiverse-oauth}
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/credentials/google-credentials.json:ro
    networks:
      - default
      - openwebui

networks:
  openwebui:
    external: true
    name: gptgauchocodecom_default
